FileVersion = 1
Dependencies = {corlib = "*", Tallow = "*"}

[Project]
Name = "TallowManager"
TargetType = "BeefConsoleApplication"
StartupObject = "TallowManager.Program"

[Configs.Debug.Linux64]
OtherLinkFlags = "$(LinkFlags) -Wl,--start-group $(WorkspaceDir)/../Tallow/build/native/libtallow_native.a $(WorkspaceDir)/../Tallow/build/native/bgfx/cmake/bgfx/libbgfx.a $(WorkspaceDir)/../Tallow/build/native/bgfx/cmake/bimg/libbimg.a $(WorkspaceDir)/../Tallow/build/native/bgfx/cmake/bimg/libbimg_decode.a $(WorkspaceDir)/../Tallow/build/native/bgfx/cmake/bx/libbx.a $(WorkspaceDir)/../Tallow/build/native/SDL/libSDL3.a $(WorkspaceDir)/../Tallow/build/native/joltc/libjoltc.a $(WorkspaceDir)/../Tallow/build/native/_deps/joltphysics-build/libJolt.a $(WorkspaceDir)/../Tallow/build/native/enet/libenet.a -Wl,--end-group -lstdc++ -lm -ldl -lpthread -lGL -lX11 "

[Configs.Release.Linux64]
CLibType = "Dynamic"
OtherLinkFlags = "$(LinkFlags) -Wl,--start-group $(WorkspaceDir)/../Tallow/build/native/libtallow_native.a $(WorkspaceDir)/../Tallow/build/native/bgfx/cmake/bgfx/libbgfx.a $(WorkspaceDir)/../Tallow/build/native/bgfx/cmake/bimg/libbimg.a $(WorkspaceDir)/../Tallow/build/native/bgfx/cmake/bimg/libbimg_decode.a $(WorkspaceDir)/../Tallow/build/native/bgfx/cmake/bx/libbx.a $(WorkspaceDir)/../Tallow/build/native/SDL/libSDL3.a $(WorkspaceDir)/../Tallow/build/native/joltc/libjoltc.a $(WorkspaceDir)/../Tallow/build/native/_deps/joltphysics-build/libJolt.a $(WorkspaceDir)/../Tallow/build/native/enet/libenet.a -Wl,--end-group -lstdc++ -lm -ldl -lpthread -lGL -lX11 "

[Configs.Debug.Win64]
CLibType = "Static"
OtherLinkFlags = "$(LinkFlags) $(WorkspaceDir)/../Tallow/build/native-win/tallow_native.lib $(WorkspaceDir)/../Tallow/build/native-win/bgfx/cmake/bgfx/bgfx.lib $(WorkspaceDir)/../Tallow/build/native-win/bgfx/cmake/bimg/bimg.lib $(WorkspaceDir)/../Tallow/build/native-win/bgfx/cmake/bimg/bimg_decode.lib $(WorkspaceDir)/../Tallow/build/native-win/bgfx/cmake/bx/bx.lib $(WorkspaceDir)/../Tallow/build/native-win/SDL/SDL3-static.lib $(WorkspaceDir)/../Tallow/build/native-win/joltc/joltc.lib $(WorkspaceDir)/../Tallow/build/native-win/_deps/joltphysics-build/Jolt.lib $(WorkspaceDir)/../Tallow/build/native-win/enet/enet.lib user32.lib gdi32.lib shell32.lib winmm.lib imm32.lib ole32.lib oleaut32.lib version.lib setupapi.lib advapi32.lib ws2_32.lib psapi.lib uuid.lib cfgmgr32.lib /MAP"

