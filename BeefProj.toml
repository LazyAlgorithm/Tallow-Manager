OtherLinkFlags = "$(LinkFlags) $(WorkspaceDir)/../Tallow/build/native-win/tallow_native.lib $(WorkspaceDir)/../Tallow/build/native-win/bgfx/cmake/bgfx/bgfx.lib $(WorkspaceDir)/../Tallow/build/native-win/bgfx/cmake/bimg/bimg.lib $(WorkspaceDir)/../Tallow/build/native-win/bgfx/cmake/bimg/bimg_decode.lib $(WorkspaceDir)/../Tallow/build/native-win/bgfx/cmake/bx/bx.lib $(WorkspaceDir)/../Tallow/build/native-win/SDL/SDL3-static.lib $(WorkspaceDir)/../Tallow/build/native-win/joltc/joltc.lib $(WorkspaceDir)/../Tallow/build/native-win/_deps/joltphysics-build/Jolt.lib $(WorkspaceDir)/../Tallow/build/native-win/enet/enet.lib user32.lib gdi32.lib shell32.lib winmm.lib imm32.lib ole32.lib oleaut32.lib version.lib setupapi.lib advapi32.lib ws2_32.lib psapi.lib uuid.lib cfgmgr32.lib"
