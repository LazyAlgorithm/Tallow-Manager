# Use Tallow's published compiler built on Ubuntu 22.04, rather than rebuilding LLVM and Beef for every cold CI runner.
name: Beef on Linux
inputs:
  beef-commit:
    required: true
  llvm-version:
    required: true
runs:
  using: composite
  steps:
    - name: Install native build tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential ninja-build cmake zip xz-utils curl \
          libx11-dev libxext-dev libxi-dev libxfixes-dev libxcursor-dev libxrandr-dev libxss-dev libxrender-dev \
          libgl-dev libegl-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev \
          libtinfo5 libxml2 zlib1g-dev libzstd-dev

    # BeefBuild links with clang and lld; the packaged compiler carries LLVM's libraries but not those programs.
    - name: Install clang and lld
      shell: bash
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh "${{ inputs.llvm-version }}"
        sudo apt-get install -y --no-install-recommends "clang-${{ inputs.llvm-version }}" "lld-${{ inputs.llvm-version }}"
        for tool in clang clang++ ld.lld; do sudo ln -sf "/usr/lib/llvm-${{ inputs.llvm-version }}/bin/$tool" "/usr/local/bin/$tool"; done

    - name: Cache the published Beef compiler
      id: beef-cache
      uses: actions/cache@v4
      with:
        path: ~/beef
        key: beef-v0.1.0-beta-a73564697836-jammy

    - name: Get the verified compiler
      if: steps.beef-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 -o "$RUNNER_TEMP/beef.tar.gz" \
          https://github.com/LazyAlgorithm/Tallow/releases/download/v0.1.0-beta/beef-linux-x64.tar.gz
        echo "a73564697836e472618b86f94413e4557455e5ccda206780149113d8bb17c5bd  $RUNNER_TEMP/beef.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/beef.tar.gz" -C "$HOME"

    - name: Select the packaged compiler
      shell: bash
      run: |
        test "${{ inputs.beef-commit }}" = b62833e327d6b08f3566b31102c57646de6916b0
        echo "BEEFBUILD=$HOME/beef/IDE/dist/BeefBuild.sh" >> "$GITHUB_ENV"
